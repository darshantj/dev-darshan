name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older, still-running build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0' # nobody is there to answer prompts

jobs:
  verify:
    name: Format, lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # reads the pnpm version from "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm # reuse downloaded packages between runs
      - run: pnpm install --frozen-lockfile # fail if package.json and the lockfile disagree
      - run: pnpm format:check
      - run: pnpm verify

  integration:
    name: Integration tests (Postgres 18)
    runs-on: ubuntu-latest
    needs: verify # don't spend minutes on Docker if the quick checks already failed
    # Same image as docker/compose.yaml. GitHub starts it before the steps and
    # waits for the health check, so the database is ready when tests begin.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci # throwaway container that lives for one job
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:int
